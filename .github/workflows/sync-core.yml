name: Sync Upstream OpCore-Simplify Core

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update core submodule to latest upstream main
        run: |
          git submodule update --remote core
          git status --short

      - name: Commit and push if core updated
        run: |
          if git diff --quiet core; then
            echo "Core submodule is already up to date."
            exit 0
          fi
          SHORT_SHA=$(git -C core rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "chore(core): sync upstream OpCore-Simplify to ${SHORT_SHA}"
          git push
